<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swollen Sunday | First Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Archivo:ital,wght@0,700;0,800;0,900;1,900&family=Bodoni+Moda:wght@500;600&display=swap" rel="stylesheet">
<style>
	:root {
		--blue: #0a2aa0;
		--deep: #07185f;
		--cream: #f6ead6;
		--yellow: #ffc20e;
		--orange: #f26a1b;
		--teal: #1a9aa0;
		--red: #e8261c;
		--sky: #1f7fd0;
		--ink: #0a0a1a;
	}
	* { box-sizing: border-box; }
	html {
		scroll-behavior: smooth;
		scroll-snap-type: y proximity;
		background: var(--deep);
	}
	body {
		margin: 0;
		color: var(--cream);
		font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
		font-weight: 800;
		-webkit-font-smoothing: antialiased;
		overflow-x: hidden;
	}

	/* One continuous background behind every section, so scrolling never hits an edge */
	.bg {
		position: fixed;
		inset: 0;
		z-index: -1;
		background:
			radial-gradient(70% 45% at 50% 108%, rgba(46, 110, 255, 0.55), transparent 70%),
			radial-gradient(60% 40% at 50% -5%, rgba(31, 127, 208, 0.35), transparent 70%),
			linear-gradient(180deg, var(--blue), var(--deep));
	}
	.bg::before {
		/* faint blueprint arcs, like the chandelier drawing on the flyer */
		content: "";
		position: absolute;
		inset: -20% -10%;
		background:
			repeating-radial-gradient(ellipse 120% 60% at 50% 120%, rgba(120, 170, 255, 0.16) 0 1px, transparent 1px 26px);
		transform: translateY(var(--shift, 0px));
		will-change: transform;
	}

	section {
		min-height: 100svh;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		padding: 64px 24px;
		scroll-snap-align: start;
		text-align: center;
	}

	/* Hero */
	.brand {
		display: flex;
		align-items: baseline;
		gap: 0.25em;
		font-size: clamp(1.8rem, 5vw, 2.8rem);
		line-height: 1;
		margin-bottom: clamp(16px, 4vh, 40px);
	}
	.brand b { font-weight: 900; font-style: italic; letter-spacing: -0.02em; }
	.brand i { font-family: "Bodoni Moda", serif; font-style: normal; font-weight: 600; letter-spacing: -0.04em; }

	h1 {
		margin: 0;
		font-family: "Bowlby One", "Archivo", sans-serif;
		font-weight: 400;
		line-height: 0.92;
		font-size: clamp(3.4rem, 15.5vw, 11rem);
	}
	.word { display: flex; justify-content: center; }
	.word + .word { margin-top: 0.04em; margin-left: 0.2em; }
	.l {
		display: inline-block;
		color: var(--c);
		-webkit-text-stroke: 0.045em var(--ink);
		paint-order: stroke fill;
		transform: rotate(var(--r, 0deg)) translateY(var(--y, 0));
		text-shadow:
			0.02em 0.02em var(--d), 0.04em 0.04em var(--d), 0.06em 0.06em var(--d),
			0.08em 0.08em var(--d), 0.10em 0.10em var(--d), 0.12em 0.12em var(--d),
			0.14em 0.14em var(--ink), 0.16em 0.16em var(--ink);
		animation: pop 0.7s cubic-bezier(.2, 1.4, .4, 1) both;
		animation-delay: calc(var(--i) * 70ms);
	}
	@keyframes pop {
		from { opacity: 0; transform: rotate(calc(var(--r, 0deg) - 14deg)) translateY(-0.5em) scale(0.6); }
		to   { opacity: 1; transform: rotate(var(--r, 0deg)) translateY(var(--y, 0)) scale(1); }
	}
	.cream  { --c: var(--cream);  --d: var(--red); }
	.blue   { --c: var(--sky);    --d: #123a8a; }
	.orange { --c: var(--orange); --d: #a32a12; }
	.teal   { --c: var(--teal);   --d: #0d4f58; }
	.red    { --c: var(--red);    --d: #7a1410; }
	.yellow { --c: var(--yellow); --d: #8a1f14; }

	.scroll-hint {
		margin-top: clamp(24px, 6vh, 56px);
		font-size: 0.95rem;
		color: var(--yellow);
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 6px;
		text-decoration: none;
	}
	.scroll-hint span { display: block; width: 14px; height: 14px; border-right: 3px solid var(--yellow); border-bottom: 3px solid var(--yellow); transform: rotate(45deg); animation: nudge 1.6s ease-in-out infinite; }
	@keyframes nudge { 50% { transform: rotate(45deg) translate(4px, 4px); } }

	/* Video */
	.video-frame {
		position: relative;
		width: min(100%, 980px);
		aspect-ratio: 16 / 9;
		background: var(--ink);
		border: 5px solid var(--ink);
		border-radius: 6px;
		box-shadow: 10px 10px 0 var(--red), 20px 20px 0 var(--orange), 30px 30px 0 var(--yellow);
		overflow: hidden;
		margin: 0 30px 30px 0;
	}
	.video-frame video { width: 100%; height: 100%; object-fit: cover; display: block; }
	.video-frame.empty::after {
		content: "Add your video file as swollen-sunday.mp4 next to this page";
		position: absolute; inset: 0;
		display: grid; place-items: center;
		padding: 24px;
		font-size: 1rem;
		color: var(--cream);
	}
	.sound {
		position: absolute;
		right: 14px; bottom: 14px;
		font: inherit;
		font-size: 0.9rem;
		padding: 10px 18px;
		border: 3px solid var(--ink);
		border-radius: 999px;
		background: var(--yellow);
		color: var(--ink);
		cursor: pointer;
	}
	.sound:hover { background: var(--cream); }
	.sound:focus-visible, .btn:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }

	/* Details */
	.time {
		font-size: clamp(4rem, 16vw, 9rem);
		line-height: 1;
		color: var(--yellow);
		letter-spacing: -0.04em;
		margin: 0 0 0.1em;
	}
	.venue {
		font-size: clamp(2rem, 7.5vw, 4.6rem);
		line-height: 1;
		letter-spacing: -0.03em;
		text-transform: uppercase;
		margin: 0;
	}
	.btn {
		display: inline-block;
		margin-top: clamp(24px, 5vh, 44px);
		padding: 16px 34px;
		font-size: 1.1rem;
		color: var(--ink);
		background: var(--yellow);
		border: 4px solid var(--ink);
		border-radius: 6px;
		text-decoration: none;
		box-shadow: 6px 6px 0 var(--red);
		transition: transform 0.15s ease, box-shadow 0.15s ease;
	}
	.btn:hover { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--red); }

	/* Travel bar, same as the flyer's yellow strip */
	.travel {
		background: var(--yellow);
		color: var(--deep);
		text-align: center;
		padding: 22px 24px calc(22px + env(safe-area-inset-bottom, 0px));
		font-size: clamp(1rem, 3.2vw, 1.5rem);
		line-height: 1.25;
		text-transform: uppercase;
		scroll-snap-align: end;
	}

	@media (prefers-reduced-motion: reduce) {
		html { scroll-behavior: auto; scroll-snap-type: none; }
		.l { animation: none; }
		.scroll-hint span { animation: none; }
	}
	@media (max-width: 600px) {
		.video-frame { box-shadow: 6px 6px 0 var(--red), 12px 12px 0 var(--orange), 18px 18px 0 var(--yellow); margin: 0 18px 18px 0; }
	}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<section id="top">
	<div class="brand"><b>First</b><i>LOVE</i></div>
	<h1 aria-label="Swollen Sunday">
		<span class="word" aria-hidden="true" id="w1"></span>
		<span class="word" aria-hidden="true" id="w2"></span>
	</h1>
	<a class="scroll-hint" href="#video">Scroll<span></span></a>
</section>

<section id="video">
	<div class="video-frame" id="frame">
		<video id="vid" muted loop playsinline preload="auto" aria-label="Swollen Sunday video">
			<source src="swollen-sunday.mp4" type="video/mp4">
		</video>
		<button class="sound" id="sound" type="button" aria-pressed="false">Sound on</button>
	</div>
</section>

<section id="details">
	<!-- Time and venue are copied from the Swollen Friday flyer. Change them if Sunday differs. -->
	<p class="time">7PM</p>
	<p class="venue">Excelsior Nawaab<br>5-7 Lortas Rd,<br>NG5 1EL</p>
	<a class="btn" href="https://www.instagram.com/firstlovenotts/" target="_blank" rel="noopener noreferrer">More info</a>
</section>

<footer class="travel">Nearest stop: Zulu Rd<br>Buses: 68, 69</footer>

<script>
	// Build the 3D lettering: [letter, colour class, rotation, vertical offset]
	const words = {
		w1: [["S","cream",-6,"0"],["W","blue",4,"-0.04em"],["O","orange",-3,"0.03em"],["L","cream",5,"-0.03em"],["L","teal",-4,"0.02em"],["E","red",3,"-0.02em"],["N","yellow",-5,"0.03em"]],
		w2: [["S","teal",-5,"0.02em"],["U","yellow",4,"-0.03em"],["N","red",-3,"0.03em"],["D","blue",5,"-0.02em"],["A","cream",-4,"0.03em"],["Y","orange",6,"-0.03em"]]
	};
	let n = 0;
	for (const id in words) {
		const el = document.getElementById(id);
		words[id].forEach(([ch, cls, r, y]) => {
			const s = document.createElement("span");
			s.className = "l " + cls;
			s.textContent = ch;
			s.style.setProperty("--r", r + "deg");
			s.style.setProperty("--y", y);
			s.style.setProperty("--i", n++);
			el.appendChild(s);
		});
	}

	// Video plays when at least half is on screen, pauses when it leaves
	const vid = document.getElementById("vid");
	const frame = document.getElementById("frame");
	const sound = document.getElementById("sound");
	vid.querySelector("source").addEventListener("error", () => frame.classList.add("empty"));

	new IntersectionObserver(([e]) => {
		if (e.isIntersecting) {
			const p = vid.play();
			if (p) p.catch(() => {});
		} else {
			vid.pause();
		}
	}, { threshold: 0.5 }).observe(vid);

	sound.addEventListener("click", () => {
		vid.muted = !vid.muted;
		sound.textContent = vid.muted ? "Sound on" : "Sound off";
		sound.setAttribute("aria-pressed", String(!vid.muted));
		if (vid.paused) vid.play().catch(() => {});
	});

	// Gentle parallax on the background lines
	const root = document.documentElement;
	let ticking = false;
	addEventListener("scroll", () => {
		if (ticking) return;
		ticking = true;
		requestAnimationFrame(() => {
			root.style.setProperty("--shift", (-scrollY * 0.15) + "px");
			ticking = false;
		});
	}, { passive: true });
</script>
</body>
</html>
